[tool.poetry]
name = "meteo-detection"
package-mode = false
version = "0.2.0"
description = "A tool for detecting meteors in sky night images."
authors = ["Chen Jiang <jiangchen516@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
astropy = "^7.0.0"
geopy = "^2.4.1"
numpy = "^2.2.0"
pytz = "^2024.2"
timezonefinder = "^6.5.7"
skyfield = "^1.49"
tqdm = "^4.67.1"
h5py = "^3.12.1"
matplotlib = "^3.9.3"
pandas = "^2.2.3"
rawpy = "^0.23.2"
opencv-python = "^4.10.0.84"
defisheye = "^1.4.1"
pyyaml = "^6.0"
click = "^8.1"
fastapi = "^0.115"
uvicorn = "^0.34"
celery = "^5.4"
redis = "^6.0"
jinja2 = "^3.1"
python-multipart = "^0.0.20"
aiofiles = "^24.1"
httpx = "^0.28"
astroalign = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
# 注：poetry.lock 已滞后（锁定 pytest 8.4.2）且与 pyproject 脱节。
# 当前 .venv 实测为 pytest 9.0.3，全部测试通过；请在有网环境执行
# `poetry lock && poetry install` 同步 lock 文件。

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
