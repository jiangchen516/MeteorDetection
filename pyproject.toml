[tool.poetry]
name = "meteo-detection"
package-mode = false
version = "0.0.1"
description = "A tool for detecting meteors in sky night images."
authors = ["Chen Jiang <jiangchen516@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
astropy = "^7.0.0"
geopy = "^2.4.1"
numpy = "^2.2.0"
pytz = "^2024.2"
timezonefinder = "^6.5.7"
skyfield = "^1.49"
tqdm = "^4.67.1"
h5py = "^3.12.1"
matplotlib = "^3.9.3"
pandas = "^2.2.3"
rawpy = "^0.23.2"
opencv-python = "^4.10.0.84"
defisheye = "^1.4.1"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


