{% extends "base.html" %}
{% block title %}调整参数 — 流星探测{% endblock %}
{% block content %}
<div class="card">
    <h2>⚙️ 调整参数</h2>
    <p style="color: #888; margin-top: 0.5rem;">任务: {{ task.id[:8] }}... | 类型: {{ task.task_type }} | 当前状态: {{ task.status }}</p>
</div>

<div class="grid-2" style="gap: 1.5rem; margin-top: 1rem;">
    <!-- 左侧：参数控制面板 -->
    <div class="card">
        <h3>检测参数</h3>
        <div style="margin-top: 1rem;">
            <div class="param-group">
                <label>预设: </label>
                <select id="presetSelect" onchange="loadPreset(this.value)" style="background:#1a1a3a; border:1px solid #2a2a4a; border-radius:6px; color:#e0e0e0; padding:0.5rem;">
                    <option value="default">默认</option>
                    <option value="sensitive">高灵敏</option>
                    <option value="strict">严格</option>
                </select>
            </div>

            <div class="param-group">
                <label>自适应阈值块大小: <span id="val-block_size">21</span></label>
                <input type="range" id="param-block_size" min="11" max="71" step="1" value="21"
                       oninput="document.getElementById('val-block_size').textContent=this.value">
            </div>

            <div class="param-group">
                <label>自适应阈值偏移: <span id="val-c">-1</span></label>
                <input type="range" id="param-c" min="-10" max="0" step="1" value="-1"
                       oninput="document.getElementById('val-c').textContent=this.value">
            </div>

            <div class="param-group">
                <label>最小线长: <span id="val-min_line_length">15</span></label>
                <input type="range" id="param-min_line_length" min="5" max="50" step="1" value="15"
                       oninput="document.getElementById('val-min_line_length').textContent=this.value">
            </div>

            <div class="param-group">
                <label>最小面积: <span id="val-min_area">5</span></label>
                <input type="range" id="param-min_area" min="1" max="30" step="1" value="5"
                       oninput="document.getElementById('val-min_area').textContent=this.value">
            </div>

            <div class="param-group">
                <label>最小长宽比: <span id="val-min_aspect">2.0</span></label>
                <input type="range" id="param-min_aspect" min="1.0" max="5.0" step="0.1" value="2.0"
                       oninput="document.getElementById('val-min_aspect').textContent=this.value">
            </div>

            <div class="param-group">
                <label>高斯模糊核: <span id="val-blur">5</span></label>
                <input type="range" id="param-blur" min="3" max="11" step="1" value="5"
                       oninput="document.getElementById('val-blur').textContent=this.value">
            </div>

            <div class="param-group">
                <label>闭运算核: <span id="val-close">3</span></label>
                <input type="range" id="param-close" min="1" max="9" step="1" value="3"
                       oninput="document.getElementById('val-close').textContent=this.value">
            </div>

            <div class="param-group">
                <label>开运算核: <span id="val-morph">1</span></label>
                <input type="range" id="param-morph" min="1" max="7" step="1" value="1"
                       oninput="document.getElementById('val-morph').textContent=this.value">
            </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
            <button class="btn btn-primary" onclick="runDetection()" style="flex:1;">🔍 开始检测</button>
            <button class="btn btn-secondary" onclick="resetParams()">重置</button>
        </div>
        <div style="margin-top: 0.5rem;">
            <button class="btn btn-success" onclick="saveResult()" style="width:100%;">💾 保存结果到任务</button>
        </div>
    </div>

    <!-- 右侧：图片和结果 -->
    <div>
        <div class="card">
            <h3>🖼️ 检测结果 <span id="resultCount" style="font-size:0.9rem; color:#888;"></span></h3>
            <div id="resultArea" style="margin-top:1rem; text-align:center; min-height:200px; display:flex; align-items:center; justify-content:center; border:2px dashed #2a2a4a; border-radius:8px;">
                {% if image_path %}
                <img src="{{ image_path }}" style="max-width:100%; border-radius:6px;" alt="原图"
                     onerror="this.parentElement.innerHTML='<p style=\'color:#666;\'>图片加载失败</p>'">
                {% else %}
                <p style="color:#666;">调整参数后点击"开始检测"</p>
                {% endif %}
            </div>
        </div>

        <div class="card" style="margin-top:1rem;">
            <h3>📊 检测统计</h3>
            <div id="statsArea" style="margin-top:0.5rem; font-size:0.9rem; color:#aaa;">
                <p>等待检测...</p>
            </div>
        </div>
    </div>
</div>

<script>
const taskId = "{{ task.id }}";
const imagePath = "{{ image_path }}";

// 页面加载时显示原图
window.addEventListener('load', () => {
    if (imagePath) {
        const area = document.getElementById('resultArea');
        area.innerHTML = `<img src="${imagePath}" style="max-width:100%; border-radius:6px;" alt="原图"
            onerror="this.parentElement.innerHTML='<p style=\\'color:#666;\\'>图片加载失败</p>'">`;
    }
});

function getParams() {
    let blockSize = parseInt(document.getElementById('param-block_size').value);
    if (blockSize % 2 === 0) blockSize += 1;

    return {
        block_size: blockSize,
        c: parseInt(document.getElementById('param-c').value),
        min_line_length: parseInt(document.getElementById('param-min_line_length').value),
        min_area: parseInt(document.getElementById('param-min_area').value),
        min_aspect: parseFloat(document.getElementById('param-min_aspect').value),
        blur: parseInt(document.getElementById('param-blur').value),
        close: parseInt(document.getElementById('param-close').value),
        morph: parseInt(document.getElementById('param-morph').value),
    };
}

function runDetection() {
    const params = getParams();
    const area = document.getElementById('resultArea');
    area.innerHTML = '<p style="color:#888;">检测中...</p>';

    fetch('/api/detect/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({image_path: imagePath, params: params})
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            area.innerHTML = `<p style="color:#ff6b66;">❌ ${data.error}</p>`;
            return;
        }
        if (data.result_image) {
            const timestamp = Date.now();
            const resultUrl = data.result_image.startsWith('/') ? data.result_image : '/' + data.result_image;
            area.innerHTML = `<img src="${resultUrl}?t=${timestamp}" style="max-width:100%; border-radius:6px;" alt="检测结果">`;
        }
        document.getElementById('resultCount').textContent = `(${data.detections} 个检测)`;
        document.getElementById('statsArea').innerHTML = `
            <p>检测数: <strong>${data.detections}</strong></p>
            <p>耗时: <strong>${data.time.toFixed(2)}s</strong></p>
        `;
    })
    .catch(err => {
        area.innerHTML = `<p style="color:#ff6b66;">❌ 请求失败: ${err}</p>`;
    });
}

function saveResult() {
    const params = getParams();
    fetch(`/api/tasks/${taskId}/save`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({params: params})
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'saved') {
            alert('结果已保存！');
            window.location.href = `/tasks/${taskId}`;
        } else {
            alert('保存失败: ' + (data.error || '未知错误'));
        }
    })
    .catch(err => {
        alert('保存失败: ' + err);
    });
}

function resetParams() {
    document.getElementById('param-block_size').value = 21;
    document.getElementById('param-c').value = -1;
    document.getElementById('param-min_line_length').value = 15;
    document.getElementById('param-min_area').value = 5;
    document.getElementById('param-min_aspect').value = 2.0;
    document.getElementById('param-blur').value = 5;
    document.getElementById('param-close').value = 3;
    document.getElementById('param-morph').value = 1;
    updateLabels();
}

function loadPreset(name) {
    const presets = {
        default: { block_size: 21, c: -1, min_line_length: 15, min_area: 5, min_aspect: 2.0, blur: 5, close: 3, morph: 1 },
        sensitive: { block_size: 15, c: -1, min_line_length: 10, min_area: 3, min_aspect: 1.5, blur: 3, close: 3, morph: 1 },
        strict: { block_size: 31, c: -5, min_line_length: 25, min_area: 10, min_aspect: 3.0, blur: 7, close: 5, morph: 3 },
    };
    const p = presets[name];
    if (!p) return;
    document.getElementById('param-block_size').value = p.block_size;
    document.getElementById('param-c').value = p.c;
    document.getElementById('param-min_line_length').value = p.min_line_length;
    document.getElementById('param-min_area').value = p.min_area;
    document.getElementById('param-min_aspect').value = p.min_aspect;
    document.getElementById('param-blur').value = p.blur;
    document.getElementById('param-close').value = p.close;
    document.getElementById('param-morph').value = p.morph;
    updateLabels();
}

function updateLabels() {
    document.getElementById('val-block_size').textContent = document.getElementById('param-block_size').value;
    document.getElementById('val-c').textContent = document.getElementById('param-c').value;
    document.getElementById('val-min_line_length').textContent = document.getElementById('param-min_line_length').value;
    document.getElementById('val-min_area').textContent = document.getElementById('param-min_area').value;
    document.getElementById('val-min_aspect').textContent = document.getElementById('param-min_aspect').value;
    document.getElementById('val-blur').textContent = document.getElementById('param-blur').value;
    document.getElementById('val-close').textContent = document.getElementById('param-close').value;
    document.getElementById('val-morph').textContent = document.getElementById('param-morph').value;
}

updateLabels();
</script>

<style>
.param-group {
    margin-bottom: 1rem;
}
.param-group label {
    display: block;
    margin-bottom: 0.25rem;
    color: #a0b0ff;
    font-size: 0.9rem;
}
.param-group input[type="range"] {
    width: 100%;
    margin: 0.25rem 0;
}
</style>
{% endblock %}
