# 流星探测项目配置

# 基础目录（运行时自动解析为绝对路径）
paths:
  base_dir: .
  outputs_dir: outputs
  data_dir: data
  test_dir: test
  storage_dir: storage

# 测试数据路径
test_paths:
  rectify_test_dir: test/rectify_test
  merge_test_dir: test/merge_tests
  rectified_images_dir: test/rectify_test
  merged_image_path: test/merged_rectified.jpg
  coords_file: outputs/coords.csv
  line_detection_output: test/line_detection

# Hough 直线检测参数
hough_line:
  rho: 1
  theta: 0.017453292519943295  # pi / 180
  threshold: 30
  min_line_length: 20
  max_line_gap: 10

# 流星检测参数
meteor_detection:
  min_line_length: 15
  max_line_gap: 10
  min_brightness: 60
  min_aspect_ratio: 5
  # 评分阈值（0-1），综合评分超过此值才认为是候选流星
  score_threshold: 0.2
  # 各评分项权重
  score_weights:
    length: 0.3
    brightness: 0.4
    aspect_ratio: 0.3
  # Stage 1 连通域筛选参数
  min_component_area: 5        # 最小连通域面积（像素），过滤噪点
  min_component_aspect: 2.0    # 最小长宽比，过滤点状恒星
  min_fill_ratio: 0.03         # 最小填充率，流星在差分图上填充率可以很低

# 轨迹跟踪参数
tracking:
  max_frames: 5
  max_gap: 2
  min_trajectory_length: 3
  linearity_threshold: 0.8

# 背景建模参数
background:
  history: 50
  threshold: 30
  learning_rate: 0.01

# 鱼眼校正参数
fisheye:
  dtype: linear
  format: fullframe
  fov: 180
  pfov: 120

# AI 模型参数
model:
  model_dir: data/trt_fp16_dir/saved_model
  label_map: data/labelmap.txt
  input_size: 640
  confidence_threshold: 0.1

# 日志参数
logging:
  level: DEBUG
  console_level: INFO
  log_dir: storage/logs
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Redis 参数
redis:
  host: localhost
  port: 6379
  db: 0
  url: null  # 如果设置，覆盖 host/port/db

# Celery 参数
celery:
  broker_url: null   # 默认使用 redis url
  result_backend: null  # 默认使用 redis url
  task_serializer: json
  result_serializer: json
  accept_content: ["json"]
  timezone: UTC
  task_track_started: true
  worker_prefetch_multiplier: 1

# Web 参数
web:
  host: 0.0.0.0
  port: 8000
  upload_max_size: 104857600  # 100MB
