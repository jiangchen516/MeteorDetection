version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    environment:
      - METEO__REDIS__HOST=redis
    depends_on:
      - redis
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    environment:
      - METEO__REDIS__HOST=redis
    depends_on:
      - redis
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2

volumes:
  redis_data:
